name: نسخ أرشيف الملفات إلى R2 (مرة واحدة)

# يُشغَّل يدوياً من تبويب Actions. ينسخ كل كتب القنوات وملفاتها وصوتياتها إلى R2،
# ويكمل من حيث توقف إن انقطع (الحالة في data/tg/files.json). تشغيله مرة ثانية آمن: لا يُعاد رفع شيء.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "أقصى عدد ملفات في هذا التشغيل"
        default: "5000"

permissions:
  contents: write

concurrency:
  group: sync            # لا يتزامن مع المزامنة الدورية حتى لا تتعارض التعديلات
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نسخ الملفات
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_STORAGE_CHAT_ID: ${{ secrets.TG_STORAGE_CHAT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip install --quiet boto3
          python3 scripts/sync_files.py --limit "${{ inputs.limit }}"

      - name: حفظ التقدّم
        if: always()     # يُحفظ ما نُسخ حتى لو انقطع التشغيل في منتصفه
        run: |
          git config user.name "library-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "لا جديد"
          else
            git commit -m "نسخ أرشيف الملفات إلى R2 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --quiet origin main
            git push
          fi
